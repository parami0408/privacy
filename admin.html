<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愿望工程 · 专慧体管理</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f5f5; }
  h1 { font-size: 1.5em; }
  .task-card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .task-header { display: flex; justify-content: space-between; flex-wrap: wrap; }
  .task-id { font-weight: bold; color: #333; }
  .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.85em; background: #e0e0e0; }
  .summary { color: #555; margin: 6px 0; white-space: pre-wrap; word-break: break-all; }
  button { margin-right: 6px; margin-top: 4px; padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
  button.primary { background: #007aff; color: #fff; border: none; }
  button.danger { background: #ff3b30; color: #fff; border: none; }
  button.success { background: #34c759; color: #fff; border: none; }
  textarea { width: 100%; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-family: inherit; }
  .detail { margin-top: 8px; background: #fafafa; padding: 8px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
  .refresh-bar { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .auto-status { font-size: 0.85em; color: #888; }
  .answer-section { margin-top: 8px; border-left: 3px solid #007aff; padding-left: 8px; }
  .answer-section label { display: block; margin-top: 4px; font-weight: bold; }
</style>
</head>
<body>
<h1>🌱 愿望工程 · 专慧体管理</h1>
<div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
  <label>服务器：</label>
  <select id="serverSelect" onchange="switchServer()" style="padding:4px;border-radius:4px;"></select>
  <label>范畴：</label>
  <select id="categoryFilter" onchange="loadTasks()" style="padding:4px;border-radius:4px;">
    <option value="">全部范畴</option>
  </select>
</div>
<div class="refresh-bar">
  <button class="primary" onclick="loadTasks()">🔄 刷新列表</button>
  <button class="primary" onclick="retryAll()">🔁 全部重试</button>
  <span class="auto-status" id="autoRefreshStatus"></span>
</div>
<div id="taskList">加载中...</div>

<script>
// 预置服务器地址列表
var SERVER_LIST = [
  { name: '本地localhost', url: 'http://localhost:6080' },
  { name: '高保护愿服务器', url: 'https:/adbprotect.yuankaikai.com' }
];

function initServerSelect() {
  var select = document.getElementById('serverSelect');
  var saved = localStorage.getItem('serverBase');
  SERVER_LIST.forEach(function(s) {
    var option = document.createElement('option');
    option.value = s.url;
    option.textContent = s.name;
    if (s.url === saved) option.selected = true;
    select.appendChild(option);
  });
  if (!saved && SERVER_LIST.length > 0) {
    localStorage.setItem('serverBase', SERVER_LIST[0].url);
  }
}

function switchServer() {
  var select = document.getElementById('serverSelect');
  localStorage.setItem('serverBase', select.value);
  loadTasks();
}

function getServerBase() {
  return localStorage.getItem('serverBase') || SERVER_LIST[0].url;
}

// 状态中文映射
const STATUS_CN = {
  pending: '待反刍',
  spiral_expert: '专家落地中',
  spiral_review: '正面审查中',
  spiral_audit: '反向审计中',
  finalizing: '终审合成中',
  paused: '已暂停',
  done: '已完成',
  aborted: '已作废',
  failed: '失败'
};
function statusText(s) { return STATUS_CN[s] || s; }

// 本地时间格式化
function localTime(utcString) {
  if (!utcString) return '-';
  return new Date(utcString).toLocaleString();
}

let pendingRequests = 0;
let autoTimer = null;

let currentAnswerMode = 'answer';   // 'answer' 或 'temp'

function apiFetch(url, options) {
  pendingRequests++;
  return fetch(url, options).finally(() => { pendingRequests--; });
}

function resetAutoRefresh() {
  if (autoTimer) clearInterval(autoTimer);
  const anyExpanded = document.querySelector('.detail[style*="block"]');
  const anyAnswerShown = document.querySelector('.answer-section[style*="block"]');
  const anyText = [...document.querySelectorAll('textarea')].some(ta => ta.value.trim() !== '');
  if (!anyExpanded && !anyAnswerShown && !anyText && pendingRequests === 0) {
    autoTimer = setInterval(loadTasks, 10000);
    document.getElementById('autoRefreshStatus').textContent = '自动刷新已开启';
  } else {
    document.getElementById('autoRefreshStatus').textContent = '自动刷新已暂停（有操作中）';
  }
}

// 加载活跃任务列表
function loadTasks() {
  apiFetch(getServerBase() + '/queue-status')
    .then(r => r.json())
    .then(data => {
      const tasks = data.activeTasks || [];
      const container = document.getElementById('taskList');
      
      // 提取所有范畴名，更新范畴下拉框
      var categories = [...new Set(tasks.map(t => t.category || 'general'))];
      var catSelect = document.getElementById('categoryFilter');
      // 默认选中当前正在处理的任务的范畴，若无则留空
      var currentCat = catSelect ? catSelect.value : '';
      if (!currentCat) {
          currentCat = (data.currentTask && data.currentTask.category) || (categories.length > 0 ? categories[0] : '');
      }
      if (catSelect) {
        catSelect.innerHTML = '';
        categories.forEach(function(cat) {
          catSelect.innerHTML += '<option value="' + cat + '"' + (cat === currentCat ? ' selected' : '') + '>' + cat + '</option>';
        });
      }

      if (!tasks.length) {
        container.innerHTML = '<p>✨ 没有活跃任务，系统空闲中。</p>';
        resetAutoRefresh();
        return;
      }
      let html = '';
      tasks.forEach(t => {
        if (currentCat && (t.category || 'general') !== currentCat) return;

        html += '<div class="task-card">';
        html += '<div class="task-header">';
        html += '<span class="task-id">' + t.taskId + '</span>';
        html += '<span class="status-badge">' + (t.category || 'general') + ' · ' + statusText(t.status) + (t.score ? ' / 分' + t.score : '') + '</span>';
        html += '</div>';
        html += '<div class="summary"><strong>问题摘要：</strong>' + (t.summary || '无') + '</div>';
        html += '<div class="summary"><strong>回答摘要：</strong>' + (t.answerSummary || '暂无') + '</div>';
        // 暂停原因显示（给管理者看）
        var hintText = t.userHint || '';
        if (!hintText) {
          if (t.status === 'paused' && t.pauseSource === 'pending') {
            hintText = '知识库无匹配，等待知识注入或手动干预';
          } else if (t.status === 'paused' && t.pauseSource === 'spiral_expert') {
            hintText = '行动方案不足，等待补充';
          } else if (t.status === 'paused') {
            hintText = '任务暂停，等待处理';
          }
        }
        // 映射为中文显示
        var HINT_CN = {
          '问题不清，补充阐述': '知识库无匹配，等待知识注入',
          '缺乏有效行动方案，请补充知识。': '行动方案不足，等待补充',
          '任务已暂停，需要补充信息': '任务暂停，等待补充信息'
        };
        var hintDisplay = HINT_CN[hintText] || hintText;
        if (hintDisplay) {
          html += '<div style="color:#ff9500;font-size:0.85em;">⏸️ ' + hintDisplay + '</div>';
        }
        html += '<div style="color:#888;font-size:0.85em;">创建：' + localTime(t.createdAt);
        if (t.lastModifiedAt && t.lastModifiedAt !== t.createdAt) {
          html += ' | 最后修改：' + localTime(t.lastModifiedAt);
        }
        html += '</div>';
        html += '<button id="toggleBtn_' + t.taskId + '" onclick="toggleDetail(\'' + t.taskId + '\')">🔍 展开详情</button>';
        html += '<div id="detail_' + t.taskId + '" class="detail" style="display:none;"></div>';
        html += '<textarea id="inject_' + t.taskId + '" rows="2" placeholder="输入注入文本...（可选，支持多行）" oninput="resetAutoRefresh()"></textarea><br>';
        html += '<button class="primary" onclick="inject(\'' + t.taskId + '\', false)">💉 注入并继续</button>';
        html += '<button class="danger" onclick="inject(\'' + t.taskId + '\', true)">✅ 满意，合成答案</button>';
        html += '<button class="success" onclick="showAnswerSection(\'' + t.taskId + '\')">✍️ 直接作答</button>';
        html += '<button class="success" onclick="showAnswerSection(\'' + t.taskId + '\', \'temp\')">⚡ 临时回答</button>';
        if (t.status === 'finalizing') {
            html += '<button class="success" onclick="fillFinalize(\'' + t.taskId + '\')">🛠️ 人工终审</button>';
        }
        html += '<button onclick="pauseTask(\'' + t.taskId + '\')" style="background:#ff9500;color:#fff;border:none;">⏸️ 暂停并提示</button>';
        html += '<button onclick="abortTask(\'' + t.taskId + '\')" style="background:#ff3b30;color:#fff;border:none;">🗑️ 作废</button>';
        html += '<button onclick="canonTask(\'' + t.taskId + '\')" style="background:#9b59b6;color:#fff;border:none;">🔮 强制纲领</button>';
        html += '<div id="answerSection_' + t.taskId + '" class="answer-section" style="display:none;">';
        html += '<label>醍醐灌顶 (epiphany):</label>';
        html += '<textarea id="epiphany_' + t.taskId + '" rows="3" placeholder="输入醍醐灌顶的内容..."></textarea>';
        html += '<label>行动指导 (guide):</label>';
        html += '<textarea id="guide_' + t.taskId + '" rows="3" placeholder="输入行动指导的内容..."></textarea>';
        html += '<button class="primary" onclick="submitAnswer(\'' + t.taskId + '\')">提交作答并结束任务</button>';
        html += '</div>';
        html += '</div>';
      });
      container.innerHTML = html;
      resetAutoRefresh();
    })
    .catch(() => {
      document.getElementById('taskList').innerHTML = '❌ 加载失败，请刷新重试。';
      resetAutoRefresh();
    });
}

// 展开/折叠详情
function toggleDetail(taskId) {
  const div = document.getElementById('detail_' + taskId);
  const btn = document.getElementById('toggleBtn_' + taskId);
  if (div.style.display === 'none' || div.style.display === '') {
    div.style.display = 'block';
    btn.textContent = '📁 折叠详情';
    if (div.innerHTML === '') {
      div.innerHTML = '加载中...';
      apiFetch(getServerBase() + '/task/' + taskId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: ''
      })
        .then(r => r.json())
        .then(task => {
          let detailHtml = '';
          detailHtml += '<strong>状态：</strong>' + statusText(task.status) + ' | <strong>分数：</strong>' + (task.score || '-') + '<br>';
          detailHtml += '<strong>创建时间：</strong>' + localTime(task.createdAt) + '<br>';
          if (task.completedAt) detailHtml += '<strong>完成时间：</strong>' + localTime(task.completedAt) + '<br>';
          detailHtml += '<strong>原问题：</strong><pre style="white-space:pre-wrap;margin:4px 0;">' + (task.originalText || '').replace(/</g, '&lt;') + '</pre>';
          // 灵魂洞察
          if (task.soulOutput) {
            detailHtml += '<strong>灵魂洞察：</strong><pre style="white-space:pre-wrap;margin:4px 0;">' + task.soulOutput.replace(/</g, '&lt;') + '</pre>';
          }
          // 行动方案
          if (task.actionOutput) {
            detailHtml += '<strong>行动方案：</strong><pre style="white-space:pre-wrap;margin:4px 0;">' + task.actionOutput.replace(/</g, '&lt;') + '</pre>';
          }
          // 打回意见
          if (task.challenge) {
            detailHtml += '<strong>打回意见：</strong>' + task.challenge + '<br>';
          }
          // 正面审查
          if (task.positiveReview) {
            detailHtml += '<strong>正面审查：</strong><pre style="white-space:pre-wrap;margin:4px 0;">' + task.positiveReview.replace(/</g, '&lt;') + '</pre>';
          }
          // 矛盾清单
          if (task.contradictions && task.contradictions.length > 0) {
            detailHtml += '<strong>矛盾清单：</strong>' + task.contradictions.join('；') + '<br>';
          }
          // 已尝试范畴
          if (task.triedCategories) {
            detailHtml += '<strong>已尝试范畴：</strong>' + task.triedCategories + '<br>';
          }
          // 暂停原因
          if (task.userHint) {
            detailHtml += '<strong>用户提示：</strong>' + task.userHint + '<br>';
          }
          // 下一轮暂停范畴
          if (task.nextPauseCategory) {
            detailHtml += '<strong>下一轮暂停范畴：</strong>' + task.nextPauseCategory + '<br>';
          }
          // 缺口记录
          if (task.gapNotes) {
            detailHtml += '<strong>缺口记录：</strong><pre style="white-space:pre-wrap;margin:4px 0;">' + task.gapNotes.replace(/</g, '&lt;') + '</pre>';
          }
          // 重复追问次数（大于0才显示）
          if (task.userRepeatCount > 0) {
            detailHtml += '<strong>重复追问次数：</strong>' + task.userRepeatCount + '<br>';
          }
          // 上帝模式
          if (task.godKnowMode) {
            detailHtml += '<strong>上帝模式：</strong>已激活<br>';
          }
          div.innerHTML = detailHtml;
        })
        .catch(() => { div.innerHTML = '获取详情失败'; });
    }
  } else {
    div.style.display = 'none';
    btn.textContent = '🔍 展开详情';
  }
  resetAutoRefresh();
}

// 注入操作
function inject(taskId, finalize) {
  const textArea = document.getElementById('inject_' + taskId);
  const text = textArea ? textArea.value : '';
  let body;
  if (finalize) {
    body = 'inject=__FINALIZE__';
  } else {
    if (!text.trim()) {
      alert('请输入注入文本，或直接点“满意，直接完成”。');
      return;
    }
    body = 'inject=' + encodeURIComponent(text);
  }
  apiFetch(getServerBase() + '/task/' + taskId + '/inject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  })
    .then(r => r.json())
    .then(res => {
      alert(JSON.stringify(res, null, 2));
      loadTasks();
    })
    .catch(() => alert('请求失败，请检查网络。'));
}

// 显示/隐藏直接作答区域
function showAnswerSection(taskId, mode) {
  currentAnswerMode = mode || 'answer';   // 记录当前作答模式
  const section = document.getElementById('answerSection_' + taskId);
  const isHidden = section.style.display === 'none' || section.style.display === '';
  if (isHidden) {
    // 展开作答区
    section.style.display = 'block';
    // 自动填充 inject 内容到两个作答框
    const injectText = document.getElementById('inject_' + taskId).value;
    if (injectText.trim()) {
      document.getElementById('epiphany_' + taskId).value = injectText;
      document.getElementById('guide_' + taskId).value = injectText;
    }
  } else {
    section.style.display = 'none';
  }
  resetAutoRefresh();  // 触发自动刷新检测，展开时暂停，收起时评估
}

// 人工终审：从已有答案填充作答区
function fillFinalize(taskId) {
    showAnswerSection(taskId, 'answer');  // 使用直接作答模式
    apiFetch(getServerBase() + '/task/' + taskId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: ''
    })
        .then(r => r.json())
        .then(task => {
            document.getElementById('epiphany_' + taskId).value = task.soulOutput || '';
            document.getElementById('guide_' + taskId).value = task.actionOutput || '';
        })
        .catch(() => {});
}

// 提交人工作答
function submitAnswer(taskId) {
  const epiphany = document.getElementById('epiphany_' + taskId).value.trim();
  const guide = document.getElementById('guide_' + taskId).value.trim();
  if (!epiphany && !guide) {
    alert('请至少填写醍醐灌顶或行动指导其中一项。');
    return;
  }
  // 拼接：__ANSWER__ 后跟 epiphany 和 guide 用换行分隔
  const answerContent = epiphany + '\n__EPIPHANY_GUIDE__\n' + guide;
  const prefix = (currentAnswerMode === 'temp') ? '__ANSWER____TEMP__' : '__ANSWER__';
  const body = 'inject=' + encodeURIComponent(prefix + '\n' + answerContent);
  apiFetch(getServerBase() + '/task/' + taskId + '/inject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  })
    .then(r => r.json())
    .then(res => {
      alert(JSON.stringify(res, null, 2));
      loadTasks();
    })
    .catch(() => alert('请求失败，请检查网络。'));
}

// 暂停任务并提示用户
function pauseTask(taskId) {
  // const textArea = document.getElementById('inject_' + taskId);
  // let promptText = (textArea && textArea.value.trim()) || '请补充更具体的问题描述。';
  const textArea = document.getElementById('inject_' + taskId);
  let promptText = (textArea && textArea.value.trim()) || '';
  // 未填写内容时，明确告知管理员此暂停不会给用户发送消息
  if (!promptText) {
    if (!confirm('未填写提示内容。此暂停仅为管理端标记，不会向用户发送任何消息。确定继续吗？')) return;
  }
  const body = 'inject=' + encodeURIComponent('__PAUSE__ ' + promptText);
  apiFetch(getServerBase() + '/task/' + taskId + '/inject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  })
    .then(r => r.json())
    .then(res => {
      alert(JSON.stringify(res, null, 2));
      loadTasks();
    })
    .catch(() => alert('请求失败，请检查网络。'));
}

// 作废任务
function abortTask(taskId) {
  if (!confirm('确定要作废这个任务吗？此操作不可恢复。')) return;
  apiFetch(getServerBase() + '/task/' + taskId + '/abort', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: ''
  })
    .then(r => r.json())
    .then(res => {
      alert(JSON.stringify(res, null, 2));
      loadTasks();
    })
    .catch(() => alert('请求失败，请检查网络。'));
}

// 强制纲领模式（GodKnow）
function canonTask(taskId) {
  if (!confirm('确定要强制启用无知识库纲领模式吗？这将跳过所有知识库检索，直接使用预设纲领生成回答。')) return;
  var body = 'inject=' + encodeURIComponent('__CANON__');
  apiFetch(getServerBase() + '/task/' + taskId + '/inject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  })
    .then(r => r.json())
    .then(res => {
      alert(JSON.stringify(res, null, 2));
      loadTasks();
    })
    .catch(() => alert('请求失败，请检查网络。'));
}

// 批量重试所有因知识库空乏暂停的任务
function retryAll() {
  if (!confirm('确定要重试所有因知识库空乏而暂停的任务吗？')) return;
  apiFetch(getServerBase() + '/retry-all', { method: 'POST' })
    .then(r => r.json())
    .then(res => {
      alert('已重新激活 ' + res.retried + ' 个任务');
      loadTasks();
    })
    .catch(() => alert('请求失败'));
}

// 页面启动
window.addEventListener('DOMContentLoaded', function() {
  initServerSelect();
  loadTasks();
});
</script>
</body>
</html>
